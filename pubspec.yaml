name: resumecraft_ai
description: A professional AI assisted resume workspace.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  shared_preferences: ^2.5.2
  http: ^1.3.0
  pdf: ^3.11.3
  printing: ^5.14.2
  file_picker: ^10.1.0
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/Regular.ttf
    - assets/fonts/Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: assets/logo.png
    background_color: "#FFFFFF"
    theme_color: "#245BDB"
