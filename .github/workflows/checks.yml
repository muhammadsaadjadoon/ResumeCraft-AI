name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --empty --platforms=android,web --project-name=resumecraft_ai --org=com.saadi .
      - run: flutter pub get
      - run: dart run scripts/configure_platforms.dart
      - run: dart format lib test scripts
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
